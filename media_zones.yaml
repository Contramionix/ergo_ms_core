# Зоны media. Префикс — начало относительного пути в хранилище.
# Самый длинный префикс побеждает, на границе каталога.
#
# remote — другой media_api. Весь префикс, включая новые файлы, пишется туда.
# Пока копия ещё не доехала, чтение старого файла берёт местный диск.
# base_url пустой (переменная не задана) — зона выключена.
# key_env — служебный ключ. На том сервере тот же ключ, свой диск в
# MEDIA_STORAGE_PATH и пустой список зон. Служебный API пускает только частные адреса.
#
# local — другой каталог на смонтированном диске. root абсолютный.
# Отдача через nginx X-Accel для такого корня не используется: файл читает media_api.

zones:
  - prefix: vacancies_parser/hh/pages
    mode: remote
    base_url: ${MEDIA_ZONE_ARCHIVE_URL}
  - prefix: vacancies_parser/hh_archive/pages
    mode: remote
    base_url: ${MEDIA_ZONE_ARCHIVE_URL}
  - prefix: education_materials_parser/university_catalog/pages
    mode: remote
    base_url: ${MEDIA_ZONE_ARCHIVE_URL}
